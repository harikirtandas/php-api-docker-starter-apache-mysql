<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>php-api-docker-starter — cliente demo</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <main>
        <h1>php-api-docker-starter</h1>
        <p class="sub">Cliente demo en JavaScript vanilla que consume la API por <code>fetch</code>. Descartable.</p>

        <section id="estado" class="card">
            <h2>Estado de la API</h2>
            <ul>
                <li><code>GET /api/ping</code>: <span id="ping">…</span></li>
                <li><code>GET /api/health/db</code>: <span id="db">…</span></li>
            </ul>
        </section>

        <section id="login-card" class="card">
            <h2>Login</h2>
            <form id="login-form">
                <label>Email <input type="email" name="email" value="demo@demo.test" required></label>
                <label>Password <input type="password" name="password" value="secret" required></label>
                <button type="submit">Entrar</button>
            </form>
            <p id="login-msg" class="msg"></p>
        </section>

        <section id="notas-card" class="card oculto">
            <h2>Notas <button id="logout" class="link">(salir)</button></h2>
            <form id="nota-form">
                <input type="text" name="titulo" placeholder="Título" maxlength="120" required>
                <input type="text" name="cuerpo" placeholder="Cuerpo">
                <button type="submit">Agregar</button>
            </form>
            <ul id="notas"></ul>
        </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
